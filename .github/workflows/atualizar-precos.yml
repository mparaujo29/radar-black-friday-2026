name: Atualizar preços - a cada 3 horas
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-precos
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar filtros de modelo (sem consumir consultas)
        run: python -m unittest discover -s tests -v
      - name: Coletar cotações brasileiras com SerpApi (se configurada)
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_MONTHLY_BUDGET: '220'
        run: python scripts/collect_serpapi.py
      - name: Consultar fonte autorizada e validar preços
        env:
          PRICE_FEED_URL: ${{ secrets.PRICE_FEED_URL }}
          PRICE_FEED_TOKEN: ${{ secrets.PRICE_FEED_TOKEN }}
          PRICE_FEED_FILE: data/.serpapi-feed.json
        run: python scripts/update_prices.py
      - name: Publicar preços verificados, se houver alteração
        run: |
          if [[ -n "$(git status --porcelain -- prices.json data/history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prices.json data/history.json
            git commit -m "Atualiza histórico de preços verificados"
            git push
          else
            echo "Nenhuma cotação nova; sem alterações."
          fi
