name: Atualizar preços - manhã e noite (com reserva)
on:
  schedule:
    - cron: '17,47 11,23 * * *' # 08:17 / 08:47 e 20:17 / 20:47 America/Sao_Paulo; a segunda é reserva
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-precos
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evitar coleta repetida na janela de reserva
        id: gate
        env:
          RUN_EVENT: ${{ github.event_name }}
        run: python scripts/should_run.py
      - name: Testar filtros de modelo (sem consumir consultas)
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -v
      - name: Coletar cotações brasileiras com SerpApi (se configurada)
        if: steps.gate.outputs.run == 'true'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_MONTHLY_BUDGET: '220'
        run: python scripts/collect_serpapi.py
      - name: Consultar fonte autorizada e validar preços
        if: steps.gate.outputs.run == 'true'
        env:
          PRICE_FEED_URL: ${{ secrets.PRICE_FEED_URL }}
          PRICE_FEED_TOKEN: ${{ secrets.PRICE_FEED_TOKEN }}
          PRICE_FEED_FILE: data/.serpapi-feed.json
        run: python scripts/update_prices.py
      - name: Registrar data da última execução concluída
        if: steps.gate.outputs.run == 'true'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/write_status.py
      - name: Publicar preços e status, se houver alteração
        if: steps.gate.outputs.run == 'true'
        run: |
          if [[ -n "$(git status --porcelain -- prices.json data/history.json status.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prices.json data/history.json status.json
            git commit -m "Atualiza histórico de preços verificados"
            git push
          else
            echo "Nenhuma cotação nova; sem alterações."
          fi
