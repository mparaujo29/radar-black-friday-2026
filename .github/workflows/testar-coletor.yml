name: Testar filtros e coletor
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'monitoring.json'
      - '.github/workflows/atualizar-precos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir sintaxe
        run: python -m compileall -q scripts tests
      - name: Executar testes sem usar API
        run: python -m unittest discover -s tests -v
